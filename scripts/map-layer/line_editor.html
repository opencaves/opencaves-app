<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Line editor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px system-ui, sans-serif; background: #2b2b2b; }
  canvas { display: block; }
  #bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
         background: #fff; padding: 6px 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  #bar b { margin-right: 8px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid #bbb; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
  button.on { background: #ffd400; border-color: #b39500; }
  button:disabled { opacity: .5; cursor: default; }
  #save { background: #2e7d32; color: #fff; border-color: #1b5e20; }
  #status { margin-left: auto; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  #help { position: absolute; bottom: 8px; left: 8px; background: rgba(255,255,255,.9); padding: 6px 10px; border-radius: 6px; color: #333; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <b id="title">…</b>
  <button id="draw" title="D">Draw</button>
  <button id="edit" title="E">Edit</button>
  <button id="undo" title="Ctrl+Z">Undo</button>
  <button id="del" title="Delete">Delete line</button>
  <label><input type="checkbox" id="walls" checked> traced walls</label>
  <label>line width <input type="range" id="width" min="1" max="8" value="3"></label>
  <button id="save">Save &amp; retrace</button>
  <span id="status"></span>
</div>
<div id="help">Draw: click to add points, double-click or Enter ends the line, Esc drops it · Edit: click a line, drag its points, Alt+click removes a point, Delete removes the line · wheel zooms, right-drag or Space+drag pans</div>
<script>
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
const scan = new Image()
const review = new Image()
let lines = []          // [[ [x, y], ... ], ...] in scan pixels
let current = null      // the line being drawn
let selected = -1
let mode = 'draw'
let view = { x: 0, y: 0, k: 1 }   // screen = (scan - view.xy) * k
let history = []
let dirty = false
let dragPoint = null, panning = null, spaceDown = false, mouse = null

const status = (text) => (document.getElementById('status').textContent = text)
const snapshot = () => { history.push(JSON.stringify(lines)); if (history.length > 200) history.shift() }
const toScan = (sx, sy) => [sx / view.k + view.x, sy / view.k + view.y]
const toScreen = (x, y) => [(x - view.x) * view.k, (y - view.y) * view.k]

function setMode(m) {
  mode = m
  if (m === 'draw') selected = -1
  document.getElementById('draw').classList.toggle('on', m === 'draw')
  document.getElementById('edit').classList.toggle('on', m === 'edit')
  canvas.style.cursor = m === 'draw' ? 'crosshair' : 'default'
  render()
}

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; render() }

function fit() {
  const k = Math.min(innerWidth / scan.width, (innerHeight - 50) / scan.height)
  view = { k, x: -(innerWidth / k - scan.width) / 2, y: -(innerHeight / k - scan.height) / 2 - 25 / k }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.fillStyle = '#2b2b2b'
  ctx.fillRect(0, 0, canvas.width, canvas.height)
  if (!scan.width) return
  ctx.setTransform(view.k, 0, 0, view.k, -view.x * view.k, -view.y * view.k)
  ctx.imageSmoothingEnabled = view.k < 2
  ctx.drawImage(scan, 0, 0)
  if (document.getElementById('walls').checked && review.width) {
    ctx.globalAlpha = 0.6
    ctx.drawImage(review, 0, 0)
    ctx.globalAlpha = 1
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  const w = +document.getElementById('width').value
  const all = current ? [...lines, current] : lines
  all.forEach((line, i) => {
    const isSel = i === selected, isCur = line === current
    ctx.beginPath()
    line.forEach(([x, y], j) => { const [sx, sy] = toScreen(x, y); j ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy) })
    if (isCur && mouse) ctx.lineTo(mouse[0], mouse[1])
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = w + 2; ctx.stroke()
    ctx.strokeStyle = isSel ? '#ff3d00' : isCur ? '#00e5ff' : '#ffd400'; ctx.lineWidth = w; ctx.stroke()
    if (isSel || isCur) {
      line.forEach(([x, y]) => {
        const [sx, sy] = toScreen(x, y)
        ctx.beginPath(); ctx.arc(sx, sy, 4, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke()
      })
    }
  })
}

// The line (and segment) nearest a screen point, within 8 px.
function hitLine(sx, sy) {
  let best = -1, bestD = 8
  lines.forEach((line, i) => {
    for (let j = 1; j < line.length; j++) {
      const [ax, ay] = toScreen(...line[j - 1]), [bx, by] = toScreen(...line[j])
      const dx = bx - ax, dy = by - ay, len = dx * dx + dy * dy || 1
      const t = Math.max(0, Math.min(1, ((sx - ax) * dx + (sy - ay) * dy) / len))
      const d = Math.hypot(sx - ax - t * dx, sy - ay - t * dy)
      if (d < bestD) { bestD = d; best = i }
    }
  })
  return best
}

function hitPoint(sx, sy) {
  if (selected < 0) return -1
  return lines[selected].findIndex(([x, y]) => { const [px, py] = toScreen(x, y); return Math.hypot(px - sx, py - sy) <= 7 })
}

function finishLine() {
  if (current && current.length >= 2) { snapshot(); lines.push(current); dirty = true; status(`${lines.length} lines (not saved)`) }
  current = null
  render()
}

canvas.addEventListener('contextmenu', (e) => e.preventDefault())
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 2 || e.button === 1 || spaceDown) { panning = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y }; return }
  if (e.button !== 0) return
  const p = toScan(e.clientX, e.clientY).map(Math.round)
  if (mode === 'draw') {
    if (e.detail >= 2) return finishLine()
    current = current || []
    current.push(p)
    render()
    return
  }
  const point = hitPoint(e.clientX, e.clientY)
  if (point >= 0) {
    snapshot()
    if (e.altKey) {
      lines[selected].splice(point, 1)
      if (lines[selected].length < 2) { lines.splice(selected, 1); selected = -1 }
      dirty = true
    } else dragPoint = point
    render()
    return
  }
  selected = hitLine(e.clientX, e.clientY)
  render()
})
addEventListener('mousemove', (e) => {
  mouse = [e.clientX, e.clientY]
  if (panning) {
    view.x = panning.vx - (e.clientX - panning.sx) / view.k
    view.y = panning.vy - (e.clientY - panning.sy) / view.k
  } else if (dragPoint !== null && selected >= 0) {
    lines[selected][dragPoint] = toScan(e.clientX, e.clientY).map(Math.round)
    dirty = true
  } else if (!current) return
  render()
})
addEventListener('mouseup', () => {
  if (dragPoint !== null) status(`${lines.length} lines (not saved)`)
  panning = null; dragPoint = null
})
canvas.addEventListener('wheel', (e) => {
  e.preventDefault()
  const [x, y] = toScan(e.clientX, e.clientY)
  view.k *= Math.exp(-e.deltaY * 0.0015)
  view.k = Math.max(0.05, Math.min(16, view.k))
  view.x = x - e.clientX / view.k
  view.y = y - e.clientY / view.k
  render()
}, { passive: false })

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return
  if (e.key === ' ') { spaceDown = true; canvas.style.cursor = 'grab'; e.preventDefault() }
  else if (e.key === 'Enter') finishLine()
  else if (e.key === 'Escape') { current = null; selected = -1; render() }
  else if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected()
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') undo()
  else if (e.key.toLowerCase() === 'd') setMode('draw')
  else if (e.key.toLowerCase() === 'e') { finishLine(); setMode('edit') }
})
addEventListener('keyup', (e) => { if (e.key === ' ') { spaceDown = false; setMode(mode) } })

function deleteSelected() {
  if (selected < 0) return
  snapshot(); lines.splice(selected, 1); selected = -1; dirty = true
  status(`${lines.length} lines (not saved)`); render()
}
function undo() {
  if (current && current.length) { current.pop(); if (!current.length) current = null; return render() }
  if (!history.length) return
  lines = JSON.parse(history.pop()); selected = -1; dirty = true; render()
}

document.getElementById('draw').onclick = () => setMode('draw')
document.getElementById('edit').onclick = () => { finishLine(); setMode('edit') }
document.getElementById('undo').onclick = undo
document.getElementById('del').onclick = deleteSelected
document.getElementById('walls').onchange = render
document.getElementById('width').oninput = render
document.getElementById('save').onclick = async () => {
  finishLine()
  const button = document.getElementById('save')
  button.disabled = true
  status('Saving and retracing… (can take a minute)')
  try {
    const response = await fetch('/save', { method: 'POST', body: JSON.stringify(lines) })
    const result = await response.json()
    if (!response.ok) throw new Error(result.error)
    dirty = false
    status(`Saved ${result.saved} lines. ${result.log.join(' · ')}`)
    review.src = '/review?' + Date.now()
  } catch (error) {
    status('Not saved: ' + error.message)
  }
  button.disabled = false
}
addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault() })
addEventListener('resize', resize)

fetch('/state').then((r) => r.json()).then((state) => {
  document.getElementById('title').textContent = state.title
  document.title = 'Lines - ' + state.title
  lines = state.lines
  status(`${lines.length} lines`)
  if (state.review) { review.onload = render; review.src = '/review' }
  scan.onload = () => { fit(); resize() }
  scan.src = '/scan'
})
setMode('draw')
</script>
</body>
</html>
